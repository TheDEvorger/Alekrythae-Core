name: Core CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Alekrythae.sln

      - name: Build solution
        run: dotnet build Alekrythae.sln --configuration Release --no-restore

      - name: Run tests with coverage
        run: >-
          dotnet test tests/Alekrythae.Core.Tests/Alekrythae.Core.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=core-tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 7
