name: Core Security Gates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security.yml'
      - '.github/dependabot.yml'
      - 'docs/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.gitignore'
      - '*.sln'
      - '*.md'
      - 'VERSION'
      - 'BUILD_CORE.cmd'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan tracked and candidate files
        shell: pwsh
        run: ./tools/Verify-SourceHygiene.ps1
      - name: Reject conflicting version metadata
        shell: pwsh
        run: ./tools/Verify-ReleaseMetadata.ps1

  windows-compatibility:
    name: Core compatibility tests (.NET 10 / Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore core and compatibility test dependencies
        shell: pwsh
        run: |
          dotnet restore src/Alekrythae.Core/Alekrythae.Core.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/Core.Compatibility/Core.Compatibility.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Windows host
        run: dotnet build src/Alekrythae.Core/Alekrythae.Core.csproj -c Release --no-restore --nologo
      - name: Execute compatibility test runner
        run: dotnet run --project tests/Core.Compatibility/Core.Compatibility.csproj -c Release --no-launch-profile
      - name: Validate embedded JavaScript syntax
        run: node --check src/Alekrythae.Core/Bridge/client.js
      - name: JOA cross-repository contract check (only when JOA sources are available)
        shell: pwsh
        run: |
          if (Test-Path '../Alekrythae.App/modules/adventures/persistence/atomic-documents.js') {
            node --test tests/client-contract.test.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'JOA repository not present in this checkout; cross-repository test deferred.'
          }

  codeql:
    name: CodeQL C# static analysis
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Build for CodeQL extraction
        run: dotnet build src/Alekrythae.Core/Alekrythae.Core.csproj -c Release --nologo
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:csharp'
